services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only when the volume is created: roles and databases (RF003, RN-37)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d internship_tracker_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local S3 API for the private bucket (D8, RNF-06); production uses Cloudflare R2.
  # SeaweedFS replaced MinIO, whose community edition stopped publishing images (2025).
  # Tag pinned: change it on purpose, after running npm run storage:check.
  storage:
    image: chrislusf/seaweedfs:4.06
    command: mini
    environment:
      AWS_ACCESS_KEY_ID: storage-local
      AWS_SECRET_ACCESS_KEY: storage-local-secret
    ports:
      - "8333:8333"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  storage_data:
