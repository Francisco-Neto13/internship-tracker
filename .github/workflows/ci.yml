name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm run test -- --run

      # TODO (tarefa 1.2/1.3 do planejamento): quando existir schema em
      # src/db/schema, criar uma branch efêmera do Neon aqui (com a API do
      # Neon, usando os segredos NEON_API_KEY e NEON_PROJECT_ID) e rodar
      # `npm run db:migrate` contra ela antes dos testes, destruindo a
      # branch no fim do job.

      # TODO: adicionar job de Playwright (npm run test:e2e) quando existir
      # fluxo de tela real para cobrir.
