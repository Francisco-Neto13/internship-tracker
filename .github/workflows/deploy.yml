name: Deploy

# What is on main goes to production, once the CI of that push is green. The key of this
# workflow only triggers the deploy (forced command on the server), which runs
# scripts/servidor/implantar.sh from origin/main. If the CI fails, nothing reaches production.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular o deploy sem alterar o servidor"
        type: boolean
        default: false

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy to production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Validate deploy secrets
        run: |
          missing=()
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]}. Cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The host key is pinned in a secret, not scanned here: a scan would trust whoever answers
      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          if [ "$DRY_RUN" = "true" ]; then cmd="deploy --dry-run"; else cmd="deploy"; fi
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$VPS_USER@$VPS_HOST" "$cmd"
