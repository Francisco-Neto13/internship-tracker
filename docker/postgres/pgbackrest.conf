# RNF-12: one full copy a week and every change in between. Lives in the encrypted volume; the
# copy outside the server is encrypted by restic (scripts/servidor/backup.sh).
[global]
repo1-path=/backup/pgbackrest
repo1-retention-full=4
compress-type=zst
start-fast=y
log-path=/backup/log
log-level-console=warn
log-level-file=info

[main]
pg1-path=/var/lib/postgresql/data
